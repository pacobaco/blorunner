<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blorunner – Lobby</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .dashboard { max-width: 900px; margin: 40px auto; padding: 20px; }
    .card { background: #1a1a22; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .btn { background: #1877f2; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; margin-right: 8px; }
    .btn:hover { background: #166fe5; }
    .btn-secondary { background: #333; }
    .team { display: flex; gap: 20px; margin-top: 15px; }
    .team-box { flex: 1; background: #121218; padding: 15px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="dashboard">
    <h1>Blorunner Lobby</h1>
    <p id="welcome">Loading...</p>
    <a href="/auth/logout" style="color:#aaa; font-size:14px;">Logout</a>

    <div class="card">
      <h2>Create New Match</h2>
      <button class="btn" onclick="createMatch()">Create Match</button>
    </div>

    <div class="card">
      <h2>Current Match</h2>
      <div id="matchInfo">No active match</div>
      <div class="team" id="teams" style="display:none;">
        <div class="team-box">
          <h3>Attackers</h3>
          <div id="attackersList"></div>
          <button class="btn" onclick="joinSide('attackers')">Join Attackers</button>
        </div>
        <div class="team-box">
          <h3>Defenders</h3>
          <div id="defendersList"></div>
          <button class="btn" onclick="joinSide('defenders')">Join Defenders</button>
        </div>
      </div>
      <br>
      <button class="btn btn-secondary" onclick="startMatch()" id="startBtn" style="display:none;">Start Match</button>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
